<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SuaraUlasan</title>
<meta name="description" content="Demo analisis sentimen ulasan aplikasi berbahasa Indonesia, berjalan sepenuhnya di browser.">
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --line: #e7e5e4; --card: #fff; --pos: #15803d; --neg: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0a09; --fg: #f5f5f4; --muted: #a8a29e; --line: #292524; --card: #1c1917; --pos: #4ade80; --neg: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  p { margin: 0; color: var(--muted); }
  textarea { width: 100%; min-height: 110px; margin: 24px 0 8px; padding: 12px; font: inherit; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; resize: vertical; }
  .ex { display: flex; flex-wrap: wrap; gap: 8px; }
  .ex button { padding: 4px 10px; font: inherit; font-size: 14px; color: var(--muted); background: none;
    border: 1px solid var(--line); border-radius: 999px; cursor: pointer; }
  #out { margin-top: 24px; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
  #label { font-size: 22px; font-weight: 600; }
  .bar { height: 6px; margin: 8px 0 16px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .bar div { height: 100%; }
  .terms span { display: inline-block; margin: 0 6px 6px 0; padding: 2px 8px; font-size: 14px; border-radius: 4px; border: 1px solid; }
  footer { margin-top: 32px; font-size: 14px; color: var(--muted); }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>SuaraUlasan</h1>
  <p>Tulis ulasan aplikasi dalam Bahasa Indonesia. Model TF-IDF + Logistic Regression berjalan langsung di browser kamu, tanpa server.</p>
  <textarea id="text" placeholder="contoh: aplikasinya sering error pas mau bayar" aria-label="Teks ulasan"></textarea>
  <div class="ex">
    <button>mantap, sangat membantu</button>
    <button>saldo nyangkut udah 3 hari</button>
    <button>tolong perbaiki, gak bisa login</button>
  </div>
  <div id="out" hidden>
    <div id="label"></div>
    <div class="bar"><div id="fill"></div></div>
    <p>Kata yang paling berpengaruh:</p>
    <div class="terms" id="terms"></div>
  </div>
  <footer>Dilatih dari ulasan Play Store Gojek, BRImo, dan MyTelkomsel. F1 0.971 pada gold set berlabel manual.
    <a href="https://github.com/SulthanAndyno/suaraulasan">Kode di GitHub</a></footer>
</main>
<script src="predict.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  let model;
  function run() {
    const text = $("text").value.trim();
    $("out").hidden = !text || !model;
    if ($("out").hidden) return;
    const r = predict(model, text);
    const color = r.label === "positif" ? "var(--pos)" : "var(--neg)";
    const conf = r.label === "positif" ? r.prob : 1 - r.prob;
    // ponytail: ambang 60% ditebak, bukan dikalibrasi; tanpa kata dikenal skornya cuma bias model
    const unsure = !r.terms.length || conf < 0.6;
    $("label").textContent = !r.terms.length ? "tidak dikenal" : unsure ? `ragu, condong ${r.label} · ${(conf * 100).toFixed(0)}%` : `${r.label} · ${(conf * 100).toFixed(0)}%`;
    $("label").style.color = unsure ? "var(--muted)" : color;
    $("fill").style.cssText = `width:${conf * 100}%;background:${color}`;
    const top = r.terms.sort((a, b) => Math.abs(b[1]) - Math.abs(a[1])).slice(0, 6);
    $("terms").replaceChildren(...top.map(([g, c]) => {
      const s = document.createElement("span");
      s.textContent = g;
      s.style.color = c > 0 ? "var(--pos)" : "var(--neg)";
      return s;
    }));
    if (!top.length) $("terms").textContent = "(tidak ada kata yang dikenal model; coba kalimat yang lebih panjang)";
  }
  $("text").addEventListener("input", run);
  document.querySelectorAll(".ex button").forEach((b) => b.onclick = () => { $("text").value = b.textContent; run(); });
  fetch("model.json").then((r) => r.json()).then((m) => { model = m; run(); });
</script>
</body>
</html>
